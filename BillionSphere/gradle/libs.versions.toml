androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }  # Compose ↔ ViewModel integration (e.g., viewModel() inside Composables).
